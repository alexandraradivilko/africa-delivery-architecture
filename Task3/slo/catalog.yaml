apiVersion: openslo/v1
kind: SLO
metadata:
  name: cat-a-ng
  displayName: CAT-A-NG
  annotations:
    africa-delivery.example/status: proposed
    africa-delivery.example/evaluation-interval: 1m
spec:
  service: catalog-ng
  indicator:
    metadata:
      name: cat-a-ng-indicator
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="cat_a",country="ng",result="good"}[1m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="cat_a",country="ng"}[1m]))
        counter: false
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.999
---
