apiVersion: openslo/v1
kind: SLO
metadata:
  name: pay-a-ng
  displayName: PAY-A-NG
  annotations:
    africa-delivery.example/status: proposed
    africa-delivery.example/evaluation-interval: 1m
spec:
  service: payments-ng
  indicator:
    metadata:
      name: pay-a-ng-indicator
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="pay_a",country="ng",provider="flutterwave",result="good"}[1m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="pay_a",country="ng",provider="flutterwave"}[1m]))
        counter: false
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.999
---
