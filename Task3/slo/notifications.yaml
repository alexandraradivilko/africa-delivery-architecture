apiVersion: openslo/v1
kind: SLO
metadata:
  name: not-h-ng-sms
  displayName: NOT-H-NG-SMS
  annotations:
    africa-delivery.example/status: proposed
    africa-delivery.example/evaluation-interval: 1m
spec:
  service: notifications-ng
  indicator:
    metadata:
      name: not-h-ng-sms-indicator
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="not_h",country="ng",channel="sms",result="good"}[1m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(increase(sli_events_total{objective="not_h",country="ng",channel="sms"}[1m]))
        counter: false
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
---
